# Вариант без Docker: обычный nginx на VPS.
#
# Положить как /etc/nginx/sites-available/bim-academy, включить симлинком
# в sites-enabled, заменить bim.example.ru на свой домен, затем:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bim.example.ru
# Certbot сам добавит блок с сертификатом и редирект с HTTP на HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name bim.example.ru;

    root /var/www/bim-academy;
    index index.html;

    # Тип для манифеста PWA: без него установка на телефон ломается.
    types {
        application/manifest+json  webmanifest;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Служебные файлы PWA всегда перепроверяются, иначе обновление
    # не доедет до установленного на телефон ярлыка.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type application/manifest+json;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* \.(png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/bim-academy.access.log;
    error_log  /var/log/nginx/bim-academy.error.log;
}
